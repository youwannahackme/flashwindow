<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450">

<defs>

  <style>

    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0F172A; }

    .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; }

    .box-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; }

    .box-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #475569; }

    .box-code { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #0F172A; }

    .tag { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: bold; }

    .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; fill: #334155; }

    .edge-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9.5px; fill: #1E40AF; font-weight: 500; }

  </style>

  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />

  </marker>

  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />

  </marker>

  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />

  </marker>

  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />

  </marker>

</defs>

<rect width="100%" height="100%" fill="#FFFFFF" />


    <rect x="80" y="70" width="740" height="300" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="80" y1="130" x2="820" y2="130" stroke="#E2E8F0" stroke-width="1" />
    <line x1="80" y1="190" x2="820" y2="190" stroke="#E2E8F0" stroke-width="1" />
    <line x1="80" y1="250" x2="820" y2="250" stroke="#E2E8F0" stroke-width="1" />
    <line x1="80" y1="310" x2="820" y2="310" stroke="#E2E8F0" stroke-width="1" />

    <!-- Y-Axis Labels -->
    <text x="35" y="74" class="box-code">100%</text>
    <text x="42" y="134" class="box-code">80%</text>
    <text x="42" y="194" class="box-code">60%</text>
    <text x="42" y="254" class="box-code">40%</text>
    <text x="42" y="314" class="box-code">20%</text>
    <text x="50" y="374" class="box-code">0%</text>
    <text x="20" y="220" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B" transform="rotate(-90 20 220)">Detection Recall (%)</text>

    <!-- X-Axis Labels -->
    <text x="120" y="395" class="box-code">W = 30s</text>
    <text x="260" y="395" class="box-code">W = 1 min</text>
    <text x="400" y="395" class="box-code">W = 3 min</text>
    <text x="540" y="395" class="box-code">W = 7 min</text>
    <text x="680" y="395" class="box-code">W = 15 min</text>
    <text x="400" y="425" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B">Tampering Dwell Window (W)</text>

    <!-- Top Horizontal Legend Bar (Cleanly separated above plot, zero bar occlusion) -->
    <rect x="165" y="14" width="550" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="190" y="21" width="12" height="12" fill="#16A34A" />
    <text x="208" y="30" font-family="Arial" font-size="9.5" font-weight="bold" fill="#0F172A">FlashWindow (Testbed Harness)</text>

    <rect x="385" y="21" width="12" height="12" fill="#2563EB" />
    <text x="403" y="30" font-family="Arial" font-size="9.5" fill="#334155">Osquery Modeled (T=15m, Eq 1)</text>

    <rect x="570" y="21" width="12" height="12" fill="#D97706" />
    <text x="588" y="30" font-family="Arial" font-size="9.5" fill="#334155">Zeek Modeled (Passive)</text>

    <!-- FlashWindow Bar Group (Green) -->
    <!-- 30s: 92.0% (92/100) -> y = 370 - (92.0 * 3) = 94 -->
    <rect x="110" y="94" width="22" height="276" fill="#16A34A" rx="2" />
    <text x="121" y="86" font-family="Arial" font-size="8.5" font-weight="bold" fill="#166534" text-anchor="middle">92%</text>
    <!-- 1m (60s): 100.0% (100/100) -> y = 370 - 300 = 70 -->
    <rect x="250" y="70" width="22" height="300" fill="#16A34A" rx="2" />
    <text x="261" y="62" font-family="Arial" font-size="8.5" font-weight="bold" fill="#166534" text-anchor="middle">100%</text>
    <!-- 3m (180s): 100.0% (100/100) -> y = 70 -->
    <rect x="390" y="70" width="22" height="300" fill="#16A34A" rx="2" />
    <text x="401" y="62" font-family="Arial" font-size="8.5" font-weight="bold" fill="#166534" text-anchor="middle">100%</text>
    <!-- 7m (420s): 100.0% (100/100) -> y = 70 -->
    <rect x="530" y="70" width="22" height="300" fill="#16A34A" rx="2" />
    <text x="541" y="62" font-family="Arial" font-size="8.5" font-weight="bold" fill="#166534" text-anchor="middle">100%</text>
    <!-- 15m (900s): 100.0% (100/100) -> y = 70 -->
    <rect x="670" y="70" width="22" height="300" fill="#16A34A" rx="2" />
    <text x="681" y="62" font-family="Arial" font-size="8.5" font-weight="bold" fill="#166534" text-anchor="middle">100%</text>

    <!-- Osquery / Endpoint Poller (Blue) -->
    <!-- 30s: 3.2% -> y = 360 -->
    <rect x="135" y="360" width="22" height="10" fill="#2563EB" rx="2" />
    <!-- 1m: 6.8% -> y = 350 -->
    <rect x="275" y="350" width="22" height="20" fill="#2563EB" rx="2" />
    <!-- 3m: 19.4% -> y = 312 -->
    <rect x="415" y="312" width="22" height="58" fill="#2563EB" rx="2" />
    <!-- 7m: 44.2% -> y = 237 -->
    <rect x="555" y="237" width="22" height="133" fill="#2563EB" rx="2" />
    <!-- 15m: 78.5% -> y = 134 -->
    <rect x="695" y="134" width="22" height="236" fill="#2563EB" rx="2" />

    <!-- Zeek Network Monitor (Orange) -->
    <!-- 30s: 18.4% -> y = 315 -->
    <rect x="160" y="315" width="22" height="55" fill="#D97706" rx="2" />
    <!-- 1m: 29.5% -> y = 281 -->
    <rect x="300" y="281" width="22" height="89" fill="#D97706" rx="2" />
    <!-- 3m: 48.0% -> y = 226 -->
    <rect x="440" y="226" width="22" height="144" fill="#D97706" rx="2" />
    <!-- 7m: 67.2% -> y = 168 -->
    <rect x="580" y="168" width="22" height="202" fill="#D97706" rx="2" />
    <!-- 15m: 84.1% -> y = 118 -->
    <rect x="720" y="118" width="22" height="252" fill="#D97706" rx="2" />
    </svg>