<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">

<defs>

  <style>

    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0F172A; }

    .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; }

    .box-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; }

    .box-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #475569; }

    .box-code { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #0F172A; }

    .tag { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: bold; }

    .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; fill: #334155; }

    .edge-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9.5px; fill: #1E40AF; font-weight: 500; }

  </style>

  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />

  </marker>

  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />

  </marker>

  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />

  </marker>

  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />

  </marker>

</defs>

<rect width="100%" height="100%" fill="#FFFFFF" />



    <rect x="80" y="40" width="740" height="320" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />

    <line x1="80" y1="120" x2="820" y2="120" stroke="#E2E8F0" stroke-width="1" />

    <line x1="80" y1="200" x2="820" y2="200" stroke="#E2E8F0" stroke-width="1" />

    <line x1="80" y1="280" x2="820" y2="280" stroke="#E2E8F0" stroke-width="1" />



    <!-- Y-Axis Labels -->

    <text x="35" y="45" class="box-code">100%</text>

    <text x="42" y="125" class="box-code">75%</text>

    <text x="42" y="205" class="box-code">50%</text>

    <text x="42" y="285" class="box-code">25%</text>

    <text x="50" y="365" class="box-code">0%</text>

    <text x="20" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B" transform="rotate(-90 20 205)">Detection Probability P(detect)</text>



    <!-- X-Axis Labels -->

    <text x="80" y="385" class="box-code">30s</text>

    <text x="200" y="385" class="box-code">2m</text>

    <text x="340" y="385" class="box-code">5m</text>

    <text x="480" y="385" class="box-code">7m</text>

    <text x="620" y="385" class="box-code">10m</text>

    <text x="760" y="385" class="box-code">15m</text>

    <text x="400" y="415" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B">Tampering Window Duration (W)</text>



    <!-- Curve 1: FlashWindow Hybrid (Green, steep surge to >99%, y=40 is 100%) -->

    <path d="M 80 58 Q 140 46, 340 43 T 820 41" fill="none" stroke="#16A34A" stroke-width="3.5" />



    <!-- Curve 2: Poisson Sampling (Blue, λ_b=0.033, reaches 39.3% at 15m -> y = 360 - 320*0.393 = 234) -->

    <path d="M 80 360 Q 320 325, 540 280 T 820 234" fill="none" stroke="#2563EB" stroke-width="2.5" />



    <!-- Curve 3: Periodic T=15m (Purple, reaches 100% at W=15m -> y=40) -->

    <path d="M 80 360 L 820 40" fill="none" stroke="#9333EA" stroke-width="2" stroke-dasharray="6,4" />



    <!-- Curve 4: Periodic T=30m (Red, reaches 50% at W=15m -> y=200) -->

    <path d="M 80 360 L 820 200" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,4" />



    <!-- Legend (Cleanly positioned in open area at x=110, y=65 with ZERO collisions) -->

    <rect x="105" y="65" width="310" height="95" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />

    <line x1="125" y1="82" x2="155" y2="82" stroke="#16A34A" stroke-width="3" />

    <text x="160" y="86" font-family="Arial" font-size="9" font-weight="bold" fill="#0F172A">FlashWindow Hybrid (λ_l = 0.1 s⁻¹, λ_b = 6/day)</text>

    

    <line x1="125" y1="104" x2="155" y2="104" stroke="#9333EA" stroke-width="2" stroke-dasharray="6,4" />

    <text x="165" y="108" font-family="Arial" font-size="9.5" fill="#334155">Periodic Full Probing (T = 15 min)</text>



    <line x1="125" y1="126" x2="155" y2="126" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,4" />

    <text x="165" y="130" font-family="Arial" font-size="9.5" fill="#334155">Periodic Full Probing (T = 30 min)</text>



    <line x1="125" y1="147" x2="155" y2="147" stroke="#2563EB" stroke-width="2.5" />

    <text x="165" y="151" font-family="Arial" font-size="9.5" fill="#334155">Poisson Full-Manifest (λ_b = 6/day)</text>

    </svg>