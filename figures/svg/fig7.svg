<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410">

<defs>

  <style>

    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0F172A; }

    .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; }

    .box-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; }

    .box-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #475569; }

    .box-code { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #0F172A; }

    .tag { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: bold; }

    .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; fill: #334155; }

    .edge-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9.5px; fill: #1E40AF; font-weight: 500; }

  </style>

  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />

  </marker>

  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />

  </marker>

  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />

  </marker>

  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />

  </marker>

</defs>

<rect width="100%" height="100%" fill="#FFFFFF" />



    <rect x="80" y="40" width="740" height="300" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />

    <line x1="80" y1="100" x2="820" y2="100" stroke="#E2E8F0" stroke-width="1" />

    <line x1="80" y1="160" x2="820" y2="160" stroke="#E2E8F0" stroke-width="1" />

    <line x1="80" y1="220" x2="820" y2="220" stroke="#E2E8F0" stroke-width="1" />

    <line x1="80" y1="280" x2="820" y2="280" stroke="#E2E8F0" stroke-width="1" />



    <!-- Labels -->

    <text x="35" y="45" class="box-code">1.0</text>

    <text x="35" y="105" class="box-code">0.8</text>

    <text x="35" y="165" class="box-code">0.6</text>

    <text x="35" y="225" class="box-code">0.4</text>

    <text x="35" y="285" class="box-code">0.2</text>

    <text x="35" y="345" class="box-code">0.0</text>

    <text x="20" y="195" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B" transform="rotate(-90 20 195)">Cumulative Probability</text>



    <text x="80" y="365" class="box-code">0s</text>

    <text x="180" y="365" class="box-code">15s</text>

    <text x="300" y="365" class="box-code">30s</text>

    <text x="440" y="365" class="box-code">60s</text>

    <text x="580" y="365" class="box-code">180s</text>

    <text x="760" y="365" class="box-code">600s</text>

    <text x="400" y="395" font-family="Arial" font-size="11" font-weight="bold" fill="#1E293B">Elapsed Time Following Attack Start (Analytical Model)</text>



    <!-- Curve 1: FlashWindow (Rapid step up to 0.98 within 30s) -->

    <path d="M 80 340 Q 150 60, 300 46 T 820 41" fill="none" stroke="#16A34A" stroke-width="3.5" />



    <!-- Curve 2: Periodic Polling (Slow linear ramp) -->

    <path d="M 80 340 L 760 100 L 820 80" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4" />



    <!-- Annotations (Cleanly separated from CDF curve lines) -->

    <rect x="235" y="110" width="245" height="50" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1" />

    <text x="245" y="128" font-family="Arial" font-size="10" font-weight="bold" fill="#166534">FlashWindow Modeled MTTD = 8.2s</text>

    <text x="245" y="145" class="box-sub" fill="#14532D">Derived from stochastic hybrid model</text>



    <rect x="480" y="260" width="245" height="50" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />

    <text x="490" y="278" font-family="Arial" font-size="10" font-weight="bold" fill="#991B1B">Periodic Poller Modeled MTTD = 462s</text>

    <text x="490" y="295" class="box-sub" fill="#7F1D1D">Analytical model under uniform onset</text>

    </svg>