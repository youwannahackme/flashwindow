<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">

<defs>

  <style>

    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0F172A; }

    .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; }

    .box-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; }

    .box-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #475569; }

    .box-code { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #0F172A; }

    .tag { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; font-weight: bold; }

    .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; fill: #334155; }

    .edge-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9.5px; fill: #1E40AF; font-weight: 500; }

  </style>

  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />

  </marker>

  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />

  </marker>

  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />

  </marker>

  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />

  </marker>

</defs>

<rect width="100%" height="100%" fill="#FFFFFF" />



    <rect x="60" y="40" width="360" height="320" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" />

    <text x="80" y="68" class="box-title">Daily Egress Bandwidth per Endpoint (MB/day)</text>



    <!-- Bar 1: Aggressive Full Polling -->

    <rect x="80" y="85" width="320" height="34" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />

    <rect x="80" y="85" width="310" height="34" rx="3" fill="#EF4444" />

    <text x="90" y="107" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF">Aggressive Full Fetch (T=1m): 288.0 MB/day</text>



    <!-- Bar 2: Standard 10m Baseline -->

    <rect x="80" y="125" width="320" height="34" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />

    <rect x="80" y="125" width="160" height="34" rx="3" fill="#F59E0B" />

    <text x="90" y="147" font-family="Arial" font-size="10" font-weight="bold" fill="#78350F">Standard Polling (T=10m): 28.8 MB/day (Baseline)</text>



    <!-- Bar 3: Moderate Full Polling -->

    <rect x="80" y="165" width="320" height="34" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1" />

    <rect x="80" y="165" width="115" height="34" rx="3" fill="#EAB308" />

    <text x="90" y="187" font-family="Arial" font-size="10" font-weight="bold" fill="#713F12">Moderate Polling (T=15m): 19.2 MB/day (90.4% red.)</text>



    <!-- Bar 4: FlashWindow Hybrid -->

    <rect x="80" y="205" width="320" height="34" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />

    <rect x="80" y="205" width="40" height="34" rx="3" fill="#10B981" />

    <text x="125" y="227" font-family="Arial" font-size="10" font-weight="bold" fill="#065F46">FlashWindow Hybrid: 1.84 MB/day (93.6% vs 10m)</text>



    <!-- Bandwidth Note -->

    <rect x="80" y="250" width="320" height="90" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />

    <text x="90" y="270" class="box-sub">- Tier-1 Micro-probes consume ~320 bytes per request.</text>

    <text x="88" y="288" font-family="Arial" font-size="9" fill="#475569">- Wire egress: 1.8608 MB/day (93.5% drop vs 10m).</text>

    <text x="88" y="306" font-family="Arial" font-size="9" fill="#475569">- Conditional ETag 304 caching: 1.84 MB/day (93.6% red.).</text>

    <text x="88" y="324" font-family="Arial" font-size="9" fill="#475569">- Full manifest (200 KB) fetched only on signal change.</text>

    

    <!-- Right Box: CPU and Memory Footprint -->

    <rect x="460" y="40" width="360" height="320" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" />

    <text x="480" y="68" class="box-title">Client Fleet Micro-Benchmark Resource Profile</text>



    <rect x="480" y="90" width="320" height="55" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />

    <text x="495" y="112" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">Amortized Daemon CPU (60s Cadence): 0.0012%</text>

    <text x="495" y="130" font-family="Arial" font-size="9" fill="#475569">Component execution profile (single core x86_64)</text>



    <rect x="480" y="160" width="320" height="55" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />

    <text x="495" y="182" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">Steady-State Resident Memory (RSS): 27.1 MB</text>

    <text x="495" y="200" class="box-sub">In-process reference prototype memory footprint</text>



    <rect x="480" y="230" width="320" height="55" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />

    <text x="495" y="252" font-family="Arial" font-size="11" font-weight="bold" fill="#1E40AF">Cryptographic Ledger: 0.39 ms (P95 1.43 ms)</text>

    <text x="495" y="270" class="box-sub">Inline TLS Mediation: 0.10 ms (P95 0.44 ms)</text>



    <rect x="480" y="300" width="320" height="42" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />

    <text x="495" y="325" font-family="Arial" font-size="10.5" font-weight="bold" fill="#065F46">Deployment: Zero kernel modifications required.</text>

    </svg>